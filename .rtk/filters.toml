schema_version = 1
# RTK Project-Local Filters — auto-generated
# Stack: OS/Shell baseline · Next.js · Docker
# Generated by Nexus Platform

[filters.ssh]
description = "Compact ssh — errors and connection status"
match_command = "^ssh\\b"
strip_ansi = true
keep_lines_matching = [
  "error",
  "Error",
  "Warning",
  "denied",
  "refused",
  "timeout",
  "connected",
  "Authenticated",
]
max_lines = 20

[filters.next-build]
description = "Compact Next.js build — errors, warnings, and route summary"
match_command = "^(npx\\s+)?next\\s+(build|dev|start)\\b"
strip_ansi = true
keep_lines_matching = [
  "Next\\.js",
  "Compiled successfully",
  "Failed to compile",
  "^Error:",
  "^TypeError:",
  "error\\s+TS",
  "Module not found",
  "Cannot find",
  "Route \\(app\\)",
  "^\\s+Size",
  "^\\s+First Load",
  "^\\s+(○|●|λ|ƒ|\\/)",
  "Generating static pages",
  "Build complete",
  "Build error",
]
max_lines = 100
tail_lines = 60

[filters.docker-build]
description = "Compact docker build — steps, errors, and image info"
match_command = "^docker\\s+(build|compose)\\b"
strip_ansi = true
keep_lines_matching = [
  "^#\\d+",
  "^Step ",
  "^STEP ",
  "^ERROR",
  "^error",
  "Successfully built",
  "Successfully tagged",
  "sha256:",
  "exporting to",
  "DONE",
  "CACHED",
  "Creating",
  "Started",
  "Stopping",
]
max_lines = 60
